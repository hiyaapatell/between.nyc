<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Between NYC | Discover the city you walk past</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#102a43;font-family:DM Sans,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 4%;border-bottom:1px solid #e9d8c7;background:#fffaf2}.brand{font:700 30px Playfair Display,serif}.brand span,.hero em{color:#ff553f}nav{display:flex;gap:20px}button,select{font:inherit;cursor:pointer}nav button{background:transparent;border:0;color:#102a43}.create{background:#102a43;color:white;border:0;border-radius:30px;padding:12px 22px}.shell{display:flex;flex-direction:column;width:100%}.hero{width:100%;min-height:calc(100svh - 77px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;position:relative;flex:none}.maparea{width:100%;flex:none;clear:both}.maparea{height:100svh;min-height:680px;scroll-margin-top:0}html{scroll-behavior:smooth;scroll-snap-type:y proximity}.hero,.maparea{scroll-snap-align:start}.hero{padding:7vw 9vw 5vw 9vw;background:#fff7ec}.eyebrow{text-transform:uppercase;letter-spacing:2.5px;font-size:11px;font-weight:700}.hero h1{font:700 clamp(58px,8vw,126px)/1.03 Playfair Display,serif;letter-spacing:-3px;margin:25px 0;max-width:900px}.hero p{max-width:380px;line-height:1.7}.selector{width:min(460px,100%);margin-top:30px;background:white;border:2px solid #e8d3bd;box-shadow:7px 7px #ffdfad;border-radius:20px;padding:20px}.selector label{display:block;margin:12px 0 7px;font-size:11px;letter-spacing:1px;font-weight:700}.selector select{background:#fff9f1;border:1px solid #dcc9b9;border-radius:10px;padding:12px;width:100%}.go{border:0;border-radius:28px;background:#ff553f;color:white;padding:15px;width:100%;margin-top:20px;font-weight:700}.message{display:none;margin-top:26px;font-size:13px;background:#ffe8b8;padding:13px;border-radius:12px}.fine{font-size:12px;color:#667580;margin-top:20px}.maparea{position:relative;min-height:680px}#map{height:100%;min-height:680px;background:#b9e7e8}.maptag{position:absolute;z-index:500;right:20px;top:20px;border-radius:25px;background:white;padding:12px 18px;font-size:12px;font-weight:700;box-shadow:0 5px 20px #1232}.toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:550;display:flex;gap:5px;background:#fffaf3;border-radius:40px;padding:8px;box-shadow:0 5px 25px #1233;max-width:95%;overflow:auto}.toolbar button{padding:10px 14px;border:0;border-radius:22px;background:transparent;white-space:nowrap;font-size:12px}.toolbar button.active{background:#ffc1b2}.maplibregl-map{font-family:DM Sans,sans-serif}.maplibregl-ctrl-attrib{font-size:10px!important}.dot{width:25px;height:25px;border-radius:50%;border:4px solid white;background:#ff553f;box-shadow:0 3px 10px #1236}.panel{position:absolute;z-index:600;top:80px;right:20px;background:#fffaf3;border:2px solid #102a43;box-shadow:6px 6px #ffb5a5;border-radius:18px;padding:18px;width:270px;max-width:calc(100% - 40px);display:none}.panel.open{display:block}.panel h2{font:700 24px Playfair Display,serif}.panel p{font-size:13px;line-height:1.6}.panel button{border:0;background:#ff553f;color:white;padding:9px 15px;border-radius:24px}.panel .x{float:right;border:0;background:none;color:#102a43;font-size:21px;padding:0}@media(max-width:850px){.shell{display:flex;flex-direction:column}.hero{padding:45px 7%;min-height:calc(100svh - 77px)}.hero h1{font-size:clamp(46px,10vw,78px)}.maparea,#map{min-height:580px}nav button:not(.create){display:none}.brand{font-size:25px}}
</style>
</head>
<body>
<header><div class="brand">Between <span>NYC</span></div><nav><button id="stories">Stories</button><button id="timeNav">Time Peel</button><button id="soundNav">Soundscapes</button><button class="create" id="create">Create Your Route ↗</button></nav></header>
<main class="shell"><section class="hero"><div class="eyebrow">The city between destinations</div><h1>Discover the NYC you walk <em>past.</em></h1><p>Choose two places and discover the stories, architecture, and details between them.</p>
<div class="selector"><label for="from">FROM</label><select id="from"></select><label for="to">TO</label><select id="to"></select><button class="go" id="explore">Explore the In-Between →</button></div>
<div class="message" id="message">Choose your destinations to begin.</div><p class="fine">↓ SCROLL TO EXPLORE THE 3D MAP</p></section>
<section class="maparea" id="explore-map"><div id="map" aria-label="Interactive Manhattan map"></div><div class="maptag">✳ MANHATTAN, NYC</div><aside class="panel" id="panel"><button class="x" id="close">×</button><div class="eyebrow">Look closer</div><h2 id="storyTitle"></h2><p id="storyBody"></p><button id="next">Next discovery →</button></aside><div class="toolbar"><button data-mode="map" class="active">◈ Map</button><button data-mode="time">◷ Time Peel</button><button data-mode="sound">♫ Hear the Block</button><button data-mode="look">◎ Look Closer</button><button data-mode="print">▣ NYC Print</button></div></section></main>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const places=[["Times Square",40.758,-73.9855],["Bryant Park",40.7536,-73.9832],["Grand Central",40.7527,-73.9772],["New York Public Library",40.7532,-73.9822],["Rockefeller Center",40.7587,-73.9787],["Flatiron Building",40.7411,-73.9897],["Washington Square Park",40.7308,-73.9973],["Union Square",40.7359,-73.9911],["Central Park South",40.7662,-73.9776]];
const discoveries=[
{title:"The New York Public Library lions",body:"Patience and Fortitude are the two famous marble lions guarding the library's entrance on Fifth Avenue.",lat:40.7532,lng:-73.9822},
{title:"The layers beneath Bryant Park",body:"Under the lawn are underground book stacks used by the New York Public Library.",lat:40.7536,lng:-73.9832},
{title:"Grand Central's sky",body:"The main concourse features a painted celestial ceiling depicting constellations.",lat:40.7527,lng:-73.9772},
{title:"The Flatiron's shape",body:"The wedge-shaped building follows the unusual intersection of Broadway and Fifth Avenue.",lat:40.7411,lng:-73.9897},
{title:"Rockefeller's hidden art",body:"Look closer at the Art Deco reliefs and public artworks around the plaza.",lat:40.7587,lng:-73.9787},
{title:"The Washington Square Arch",body:"The marble arch commemorates the centennial of George Washington's inauguration.",lat:40.7308,lng:-73.9973}
];
const from=document.getElementById("from"),to=document.getElementById("to"),msg=document.getElementById("message");
places.forEach((p,i)=>{from.add(new Option(p[0],i));to.add(new Option(p[0],i))});to.value="1";

const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[-73.982,40.755],zoom:15.4,pitch:63,bearing:-24,antialias:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
let routeData=null,nearby=[],current=0,markers=[];
const blank={type:"FeatureCollection",features:[]};
map.on("load",()=>{
  const style=map.getStyle();
  const sourceName=Object.keys(style.sources).find(k=>style.sources[k].type==="vector");
  if(sourceName){
    try{map.addLayer({id:"between-3d-buildings",type:"fill-extrusion",source:sourceName,"source-layer":"building",minzoom:13,paint:{"fill-extrusion-color":["interpolate",["linear"],["coalesce",["get","render_height"],["get","height"],12],0,"#ffc1a0",25,"#f3a987",80,"#ff7968",200,"#edb5d6"],"fill-extrusion-height":["coalesce",["to-number",["get","render_height"]],["to-number",["get","height"]],18],"fill-extrusion-base":["coalesce",["to-number",["get","render_min_height"]],0],"fill-extrusion-opacity":0.88}})}catch(e){console.warn("3D building layer not available",e)}
  }
  map.addSource("walking-route",{type:"geojson",data:blank});
  map.addLayer({id:"route-glow",type:"line",source:"walking-route",paint:{"line-color":"#ffb4a2","line-width":13,"line-opacity":0.6}});
  map.addLayer({id:"walking-route-line",type:"line",source:"walking-route",paint:{"line-color":"#ff4d39","line-width":6}});
  if(routeData)renderRoute(routeData);
});
function show(d){document.getElementById("storyTitle").textContent=d.title;document.getElementById("storyBody").textContent=d.body;document.getElementById("panel").classList.add("open");map.flyTo({center:[d.lng,d.lat],zoom:16.5,pitch:65,bearing:-20})}
function distance(d,p){return Math.hypot((d.lat-p[1])*111,(d.lng-p[0])*84)}
function decorate(coords){
  markers.forEach(m=>m.remove());markers=[];
  nearby=discoveries.map(d=>({...d,proximity:Math.min(...coords.map(p=>distance(d,p)))})).filter(d=>d.proximity<.6).sort((a,b)=>a.proximity-b.proximity);
  if(!nearby.length)nearby=discoveries.slice(0,3);
  nearby.forEach(d=>{const el=document.createElement("div");el.className="dot";el.style.cursor="pointer";el.addEventListener("click",()=>show(d));markers.push(new maplibregl.Marker({element:el}).setLngLat([d.lng,d.lat]).addTo(map))});
  msg.textContent=nearby.length+" discoveries nearby. Click coral pins to explore.";
}
function renderRoute(coords){
  routeData=coords;
  const source=map.getSource("walking-route");
  if(source)source.setData({type:"FeatureCollection",features:[{type:"Feature",geometry:{type:"LineString",coordinates:coords},properties:{}}]});
  const bounds=new maplibregl.LngLatBounds();coords.forEach(p=>bounds.extend(p));
  map.resize();map.fitBounds(bounds,{padding:90,maxZoom:16.5,pitch:60,bearing:-24,duration:1200});
  decorate(coords);
}
async function explore(){
 const a=places[+from.value],b=places[+to.value];
 if(a===b){msg.textContent="Choose two different places.";return}
 msg.textContent="Finding your route…";
 let coords=[[a[2],a[1]],[b[2],b[1]]];
 try{
  const url="https://router.project-osrm.org/route/v1/foot/"+a[2]+","+a[1]+";"+b[2]+","+b[1]+"?overview=full&geometries=geojson";
  const r=await fetch(url);if(!r.ok)throw Error("unavailable");
  const data=await r.json();if(!data.routes?.[0])throw Error("unavailable");
  coords=data.routes[0].geometry.coordinates;
 }catch(e){msg.textContent="Routing service unavailable. Showing a straight-line preview."}
 renderRoute(coords);
 document.getElementById("explore-map").scrollIntoView({behavior:"smooth"});
}
function mode(m){
 document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
 if(m==="time")msg.textContent="Historical Time Peel imagery is planned for a future update.";
 if(m==="sound")msg.textContent="Local sound recordings are planned for a future update.";
 if(m==="map")msg.textContent="Select two places and explore the 3D map.";
 if(m==="print")window.print();
 if(m==="look"&&nearby.length){current=0;show(nearby[0])}
}
document.getElementById("explore").onclick=explore;
document.getElementById("create").onclick=()=>document.querySelector(".selector").scrollIntoView({behavior:"smooth"});
document.getElementById("close").onclick=()=>document.getElementById("panel").classList.remove("open");
document.getElementById("next").onclick=()=>{if(nearby.length){current=(current+1)%nearby.length;show(nearby[current])}};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>mode(b.dataset.mode));
document.getElementById("stories").onclick=()=>mode("look");
document.getElementById("timeNav").onclick=()=>mode("time");
document.getElementById("soundNav").onclick=()=>mode("sound");
new IntersectionObserver(entries=>{if(entries[0].isIntersecting)map.resize()},{threshold:0.1}).observe(document.getElementById("explore-map"));

</script>
</body></html>
